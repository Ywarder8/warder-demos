<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14382b">
<meta name="robots" content="noindex, nofollow">
<title>Warder Demos</title>
<meta name="description" content="Private demos of AI tools built for local businesses.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232e7a59'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --brand-800: #14382b; --brand-500: #2e7a59; --brand-300: #8cc9a6;
    --char-950: #141618; --text: #edf2ee; --muted: #9ea9a3;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: var(--font); color: var(--text); background: var(--char-950);
    background-image: radial-gradient(1000px 500px at 50% -10%, rgba(46,122,89,.2), transparent 60%);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; padding: 32px 16px; text-align: center; }
  .badge {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center;
    background: linear-gradient(145deg, var(--brand-500), var(--brand-800)); font-weight: 800; font-size: 24px;
  }
  h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.3px; }
  p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
</style>
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">W</div>
  <h1>Warder Demos</h1>
  <!-- Client demos are deliberately not listed here: each client gets only their own direct link.
       The full list lives in README.md. -->
  <p>Demos of AI tools built for local businesses. Each demo is shared privately by direct link.</p>
</main>
</body>
</html>
