<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14382b">
<title>CLC Tree Services · AI Receptionist Demo</title>
<meta name="description" content="Call CLC Tree Services and talk to Ava, an AI receptionist that takes storm-damage calls, flags emergencies, and texts the crew a summary.">
<meta property="og:title" content="CLC Tree Services · AI Receptionist Demo">
<meta property="og:description" content="Try the call: Ava takes a storm-damage intake, flags urgent calls, and texts the crew a summary.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232e7a59'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    /* Overridden at boot from CONFIG.theme */
    --brand-900: #0f2d22;
    --brand-800: #14382b;
    --brand-700: #1d4d3b;
    --brand-500: #2e7a59;
    --brand-300: #8cc9a6;
    --char-950: #141618;
    --char-900: #1b1e21;
    --char-800: #23272b;
    --char-700: #2d3237;
    --char-600: #3a4046;
    --text: #edf2ee;
    --muted: #9ea9a3;
    --urgent: #c8282e;   /* 5.3:1 against white text */
    --urgent-bg: #3a1618;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--text);
    background: var(--char-950);
    background-image: radial-gradient(1200px 600px at 50% -10%, rgba(46,122,89,.18), transparent 60%);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--char-900);
    border-left: 1px solid var(--char-800);
    border-right: 1px solid var(--char-800);
  }

  /* ---------- Intro ---------- */
  .intro {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 32px 24px;
    gap: 18px;
  }
  .logo {
    width: 84px; height: 84px; border-radius: 24px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--brand-500), var(--brand-800));
    font-weight: 800; letter-spacing: .5px; font-size: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .intro h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.2; }
  .intro .where { color: var(--muted); margin: 4px 0 0; font-size: 14.5px; line-height: 1.5; white-space: pre-line; }
  .scenario {
    background: var(--char-800); border: 1px solid var(--char-700);
    border-radius: 14px; padding: 14px 16px; max-width: 380px;
    color: #cfd7d2; font-size: 15px; line-height: 1.5;
  }
  .scenario strong { color: var(--text); }
  .call-btn {
    display: inline-flex; align-items: center; gap: 10px;
    border: 0; border-radius: 999px;
    padding: 15px 26px; font-size: 17px; font-weight: 650;
    background: var(--brand-500); color: #fff;
    box-shadow: 0 8px 24px rgba(46,122,89,.35);
    transition: transform .12s ease, background .15s ease;
  }
  .call-btn:hover { background: #33875f; }
  .call-btn:active { transform: scale(.97); }
  .call-btn svg { width: 20px; height: 20px; }
  .fineprint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .picker-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 420px; }
  .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .pick {
    text-align: left; border: 1px solid var(--char-700); background: var(--char-800); color: var(--text);
    border-radius: 14px; padding: 12px 13px; display: flex; flex-direction: column; gap: 3px;
    transition: border-color .12s ease, background .12s ease;
  }
  .pick:hover { border-color: var(--brand-500); }
  .pick[aria-checked="true"] { border-color: var(--brand-500); background: rgba(46,122,89,.16); box-shadow: inset 0 0 0 1px var(--brand-500); }
  .pick .t { font-weight: 650; font-size: 15px; }
  .pick .w { font-size: 12px; color: var(--brand-300); text-transform: uppercase; letter-spacing: .5px; }
  .pick .b { font-size: 13.5px; color: #c9d2cd; line-height: 1.4; }
  .when-label { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

  /* ---------- Call header ---------- */
  .call-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: var(--brand-800);
    border-bottom: 1px solid var(--brand-900);
  }
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--brand-500); font-weight: 700; font-size: 16px;
  }
  .who { flex: 1; min-width: 0; }
  .who .name { margin: 0; font-weight: 650; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .sub { color: var(--brand-300); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .live-dot { position: relative; width: 7px; height: 7px; border-radius: 50%; background: #5fd68f; }
  .live-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #5fd68f; animation: pulse 1.8s ease-out infinite; will-change: transform, opacity; }
  .live-dot.off { background: var(--muted); }
  .live-dot.off::after { display: none; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(3); opacity: 0; } }
  .who .sub span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .urgent-bar {
    background: var(--urgent); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .3px;
    padding: 7px 16px; text-align: center; animation: rise .22s ease-out;
  }
  .icon-btn {
    flex: none; border: 1px solid rgba(255,255,255,.14); background: transparent;
    border-radius: 10px; padding: 7px 10px; font-size: 13px; color: #d8e6dd;
  }
  .icon-btn:hover { background: rgba(255,255,255,.06); }
  .icon-btn.round { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  .icon-btn svg { width: 19px; height: 19px; }
  #voiceBtn .mute { display: none; }
  #voiceBtn[aria-pressed="false"] .wave { display: none; }
  #voiceBtn[aria-pressed="false"] .mute { display: inline; }
  #voiceBtn[aria-pressed="false"] { color: var(--muted); }
  .mic {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--char-600); background: var(--char-800); color: var(--brand-300);
    display: grid; place-items: center;
  }
  .mic svg { width: 20px; height: 20px; }
  .mic:disabled { opacity: .4; cursor: not-allowed; }
  .mic { position: relative; }
  .mic.listening { background: var(--urgent); border-color: var(--urgent); color: #fff; }
  .mic.listening::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 2px solid var(--urgent); animation: micPulse 1.4s ease-out infinite; will-change: transform, opacity; pointer-events: none; }
  @keyframes micPulse { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(1.35); opacity: 0; } }
  .end-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ghost {
    border: 1px solid var(--brand-500); background: transparent; color: var(--brand-300);
    border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: 16px;
  }
  .ghost:hover { background: rgba(46,122,89,.15); }
  .transcript { width: 100%; max-width: 360px; background: var(--char-800); border: 1px solid var(--char-700); border-radius: 14px; }
  .transcript summary { cursor: pointer; padding: 12px 16px; font-size: 14px; color: var(--brand-300); }
  .transcript > div { padding: 0 16px 14px; font-size: 13.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 6px; }
  .transcript p { margin: 0; }
  .transcript b { color: var(--brand-300); font-weight: 600; }

  /* ---------- Chat ---------- */
  .chat:focus-visible { outline: 2px solid var(--brand-300); outline-offset: -2px; }
  .chat {
    flex: 1; overflow-y: auto; padding: 18px 14px 8px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; contain: layout; }
  .row.caller { justify-content: flex-end; }
  .row .mini {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--brand-700); display: grid; place-items: center;
    font-size: 11.5px; font-weight: 700; color: var(--brand-300);
  }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: var(--radius);
    font-size: 15.5px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
    animation: rise .22s ease-out;
  }
  .agent .bubble { background: var(--char-700); border-bottom-left-radius: 6px; }
  .caller .bubble { background: var(--brand-500); color: #fff; border-bottom-right-radius: 6px; }
  .agent .bubble.alert { background: var(--urgent-bg); border: 1px solid rgba(229,72,77,.5); }
  .agent .bubble.alert b { color: #ff8b8e; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
  .sys {
    align-self: center; font-size: 12.5px; color: var(--muted);
    background: var(--char-800); border-radius: 999px; padding: 5px 12px;
  }
  .card { padding: 12px 14px; white-space: normal; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14.5px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .card .flag { grid-column: 1 / -1; color: #ff8b8e; font-weight: 800; letter-spacing: .5px; }
  .typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: none;} 30% { opacity: 1; transform: translateY(-2px);} }

  /* ---------- Composer ---------- */
  .composer {
    border-top: 1px solid var(--char-800);
    background: var(--char-900);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chips:empty { display: none; }
  .chip {
    border: 1px solid var(--brand-500); background: transparent; color: var(--brand-300);
    border-radius: 999px; padding: 8px 14px; font-size: 14.5px;
    transition: background .12s ease, color .12s ease;
  }
  .chip:hover { background: rgba(46,122,89,.18); }
  .chip[aria-pressed="true"] { background: var(--brand-500); color: #fff; }
  .chip.primary { background: var(--brand-500); color: #fff; font-weight: 600; }
  .chip.primary:disabled { opacity: .4; cursor: not-allowed; }
  .chip-hint { width: 100%; font-size: 12.5px; color: var(--muted); margin: -2px 0 0; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; min-width: 0;
    background: var(--char-800); border: 1px solid var(--char-700); color: var(--text);
    border-radius: 999px; padding: 12px 16px; font-size: 16px;
  }
  .input-row input::placeholder { color: #77827c; }
  .input-row input:disabled { opacity: .55; }
  .send {
    flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: var(--brand-500); display: grid; place-items: center;
  }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .send svg { width: 20px; height: 20px; }

  /* ---------- End screen ---------- */
  .end {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 32px; gap: 18px;
  }
  .end h1 { margin: 0; font-size: 20px; text-align: center; }
  .end .lede { margin: -8px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
  .phone {
    width: 100%; max-width: 360px;
    background: #000; border-radius: 44px; padding: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 0 0 2px #2b2f33;
  }
  .screen { background: #f2f2f4; color: #111; border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; min-height: 560px; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 4px; font-size: 13px; font-weight: 600; }
  .status .island { width: 92px; height: 24px; background: #000; border-radius: 14px; }
  .thread-head { text-align: center; padding: 8px 12px 12px; border-bottom: 1px solid #dcdce0; background: #f7f7f9; }
  .thread-head .tav {
    width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 6px;
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
    background: linear-gradient(145deg, var(--brand-500), var(--brand-800));
  }
  .thread-head .tt { font-weight: 650; font-size: 14.5px; }
  .thread-head .ts { color: #6b6f76; font-size: 12px; margin-top: 2px; }
  .thread { flex: 1; padding: 14px 12px 16px; display: flex; flex-direction: column; gap: 4px; }
  .thread .stamp { text-align: center; color: #5f636a; font-size: 11.5px; margin-bottom: 8px; }
  .sms {
    align-self: flex-end; max-width: 88%;
    background: var(--brand-500); color: #fff;
    border-radius: 18px; border-bottom-right-radius: 5px;
    padding: 10px 13px; font-size: 14.5px; line-height: 1.42;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .sms .urgent-tag {
    display: inline-block; background: var(--urgent); color: #fff; font-weight: 800; letter-spacing: .6px;
    border-radius: 6px; padding: 2px 7px; margin-bottom: 6px; font-size: 13px;
  }
  .sms b { font-weight: 650; }
  .nowrap { white-space: nowrap; }
  .delivered { align-self: flex-end; color: #5f636a; font-size: 11.5px; margin-right: 4px; }
  .compose-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px 14px; }
  .compose-bar span { flex: 1; border: 1px solid #d0d0d6; border-radius: 999px; padding: 7px 12px; color: #6b6f76; font-size: 13.5px; background: #fff; }
  .restart {
    border: 0; border-radius: 999px; padding: 13px 28px; font-weight: 650; font-size: 16px;
    background: var(--brand-500); color: #fff;
  }
  .restart:hover { background: #33875f; }
  .note { color: var(--muted); font-size: 12.5px; text-align: center; max-width: 360px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  @media (min-width: 600px) {
    .app { margin-top: 0; }
  }
</style>
</head>
<body>
<main class="app">

  <!-- Intro -->
  <section class="intro" id="intro">
    <div class="logo" id="introLogo"></div>
    <div>
      <h1 id="introName"></h1>
      <p class="where" id="introWhere"></p>
    </div>
    <div class="scenario" id="introScenario"></div>
    <div class="picker-wrap">
      <span class="when-label" id="pickLabel"></span>
      <div class="picker" role="radiogroup" id="picker"></div>
    </div>
    <button class="call-btn" id="callBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      <span id="callBtnLabel"></span>
    </button>
    <p class="fineprint">Demo only. Nothing is saved, and typed answers never leave your browser.</p>
  </section>

  <!-- Call -->
  <section id="call" hidden style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <header class="call-head">
      <div class="avatar" id="headAvatar"></div>
      <div class="who">
        <h1 class="name" id="headName"></h1>
        <div class="sub"><span class="live-dot" id="liveDot"></span><span id="headSub"></span></div>
      </div>
      <button class="icon-btn round" id="voiceBtn" aria-label="Receptionist voice" aria-pressed="true" title="Voice on/off" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="mute" d="m16 9 6 6m0-6-6 6"/></svg>
      </button>
      <button class="icon-btn round" id="restartTop" aria-label="Start over" title="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </header>
    <div class="urgent-bar" id="urgentPill" role="status" hidden></div>
    <div class="chat" id="chat" role="log" aria-live="polite" aria-label="Call transcript" tabindex="0"></div>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <form class="input-row" id="form" autocomplete="off">
        <input id="input" type="text" aria-label="Your reply" placeholder="Type your reply…" disabled>
        <button class="mic" id="mic" type="button" aria-label="Speak your reply" title="Speak your reply" hidden disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
        </button>
      </form>
    </div>
  </section>

  <!-- End screen -->
  <section class="end" id="end" hidden>
    <h1>The crew's phone just buzzed</h1>
    <p class="lede" id="endLede"></p>
    <div class="phone" aria-label="Text message mockup">
      <div class="screen">
        <div class="status"><span id="smsClock">9:41</span><span class="island"></span><span>5G ▮▮▮</span></div>
        <div class="thread-head">
          <div class="tav" id="smsAvatar"></div>
          <div class="tt" id="smsTitle"></div>
          <div class="ts" id="smsSub"></div>
        </div>
        <div class="thread">
          <div class="stamp" id="smsStamp"></div>
          <div class="sms" id="smsBody"></div>
          <div class="delivered">Delivered</div>
        </div>
        <div class="compose-bar"><span>Text Message</span></div>
      </div>
    </div>
    <div class="end-actions">
      <button class="restart" id="restartEnd">Start over</button>
      <button class="ghost" id="copyBtn">Copy summary</button>
    </div>
    <details class="transcript">
      <summary>Show call transcript</summary>
      <div id="transcript"></div>
    </details>
    <p class="note" id="endNote"></p>
  </section>
</main>

<script>
/* =====================================================================
   CONFIG — swap this object to reuse the demo for another business.
   Everything business-specific (names, wording, questions, urgency
   rules, guardrails, summary layout, colours) lives here.
   ===================================================================== */
const CONFIG = {
  business: {
    name: "CLC Tree Services Ltd",
    shortName: "CLC Tree Services",
    initials: "CLC",
    possessive: "CLC's",                 // for "{possessive} estimates are free"
    address: "7024 Kerr Rd, London",
    phone: "(519) 685-0257",             // their published main line (the demo never dials it)
    tagline: "ISA Certified Arborists · In business since 1988",
    serviceArea: "London and the surrounding area",   // their own wording; no invented town list
  },

  receptionist: { name: "Ava", role: "AI receptionist" },   // rename here; every line below uses {receptionist}

  theme: {
    "--brand-900": "#0f2d22",
    "--brand-800": "#14382b",
    "--brand-700": "#1d4d3b",
    "--brand-500": "#2e7a59",
    "--brand-300": "#8cc9a6",
    "--char-950": "#141618",
    "--char-900": "#1b1e21",
  },

  intro: {
    pitch: "Everything at {business} runs through one main line. {receptionist} picks up when the team can't: after hours and while the crew is out on a job.",
    pickLabel: "Pick a call to try",
    callLabel: "Call {businessPhone}",
  },

  // Demo scenarios shown on the intro screen. The first one is the default.
  // `samples` show up as one-tap answers so a demo can be clicked straight through.
  scenarios: [
    {
      id: "storm",
      title: "Storm emergency",
      when: "Sunday morning",
      blurb: "A big tree came down in last night's storm.",
      flow: "emergency",
      clock: { day: "Sunday", time: "8:12 AM" },
      greeting: "Thanks for calling {business}, this is {receptionist}. I'm answering for the team this morning. How can I help?",
      suggestions: ["A big tree came down in the storm last night", "Am I talking to a real person?", "How fast can you get here?"],

  const firstName = () => (S.answers.name || "").split(/\s+/)[0] || "";

    const vars = {
      business: CONFIG.business.shortName,
      businessName: CONFIG.business.name,
      businessPhone: CONFIG.business.phone,
      possessive: CONFIG.business.possessive || CONFIG.business.shortName + "'s",
      receptionist: CONFIG.receptionist.name,
      role: CONFIG.receptionist.role,

    if (!voices.length) return;
    const lang = (V.lang || "en").toLowerCase();
    for (const want of V.preferredVoices || []) {

      if (v) { chosenVoice = v; return; }

  function sys(text) {
    const d = document.createElement("div");
    d.className = "sys"; d.textContent = text;
    els.chat.appendChild(d); scrollDown();
  }
  async function say(text, opts = {}) {
    await untilQuiet();
    const typing = document.createElement("div");
    typing.className = "bubble typing"; typing.setAttribute("aria-label", CONFIG.receptionist.name + " is typing");
    typing.innerHTML = "<i></i><i></i><i></i>";
    const row = addRow("agent", typing);
    const plain = text.replace(/<[^>]+>/g, "");
    const t = CONFIG.timing;
    try { await wait(Math.min(t.maxTyping, t.minTyping + plain.length * t.perChar)); }
    finally { row.remove(); }
    bubble("agent", text, opts);
    speak(text);
  }

  function setComposer(enabled, placeholder) {
    els.input.disabled = !enabled; els.send.disabled = !enabled; els.mic.disabled = !enabled;
    if (!enabled) stopListening();
    els.input.placeholder = placeholder || "Type your reply…";
    if (enabled && !("ontouchstart" in window)) els.input.focus();
  }
  function clearChips() { els.chips.innerHTML = ""; }
  function renderChips(list) {
    clearChips();
    list.forEach((c) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = c.label;
      b.addEventListener("click", () => handleInput(c.label, c));
      els.chips.appendChild(b);
    });
  }
  function renderStepChips(step) {
    if (step.type === "choice") {
      renderChips(step.options.map((o) => ({ label: o.label, option: o })));
    } else if (step.type === "multi") {
      clearChips();
      const hinted = new Set([...(S.hints[step.key] || []), ...(S.soft[step.key] || [])]);
      S.multiSel = new Set(step.options.filter((o) => hinted.has(optValue(o))));
      const go = document.createElement("button");
      go.type = "button"; go.className = "chip primary"; go.textContent = "Continue"; go.disabled = S.multiSel.size === 0;
      const btns = step.options.map((o) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = o.label; b.setAttribute("aria-pressed", S.multiSel.has(o) ? "true" : "false");
        b.addEventListener("click", () => {
          if (S.multiSel.has(o)) S.multiSel.delete(o);
          else {
            if (o.none) S.multiSel.clear();
            else step.options.filter((x) => x.none).forEach((x) => S.multiSel.delete(x));
            S.multiSel.add(o);
          }
          btns.forEach((bb, i) => bb.setAttribute("aria-pressed", S.multiSel.has(step.options[i]) ? "true" : "false"));
          go.disabled = S.multiSel.size === 0;
        });
        els.chips.appendChild(b);
        return b;
      });
      go.addEventListener("click", () => {
        const picked = step.options.filter((o) => S.multiSel.has(o));
        handleInput(picked.map((o) => o.label).join(", "), { multi: picked });
      });
      els.chips.appendChild(go);
      if (step.hint) { const h = document.createElement("p"); h.className = "chip-hint"; h.textContent = step.hint; els.chips.appendChild(h); }
    } else {
      const list = [];
      if (step.optional && step.skipChip) list.push({ label: step.skipChip, skip: true });
      const sample = scenario.samples && scenario.samples[step.key];
      if (sample && !S.editing) list.push({ label: sample, sample: true });
      if (list.length) renderChips(list); else clearChips();
    }
  }

  /* ---------- parsing ---------- */
  function matchGuardrails(text) { return CONFIG.guardrails.filter((g) => g.match.test(text)); }
  const optMatches = (o, text) => !!(o.match && o.match.test(text) && !(o.unless && o.unless.test(text)));
  function bestOption(options, text) {
    const hits = options.filter((o) => optMatches(o, text));
    hits.sort((a, b) => (b.priority || 1) - (a.priority || 1));
    return hits[0] || null;
  }
  const optValue = (o) => o.value || o.label;
  const optDisplay = (o) => o.summary || o.label;

  function parse(step, text, chip, guarded) {
    const isQuestion = /\?\s*$/.test(text);
    if (step.type === "choice") {
      if (!chip && step.askOnConflict && step.options.filter((x) => optMatches(x, text)).length > 1) return { ok: false };
      const o = chip && chip.option ? chip.option : bestOption(step.options, text);
      if (o && o.other && o.followUp) return { followUp: o };
      if (o) return { ok: true, raw: optValue(o), display: optDisplay(o) };
      if (step.freeform && !guarded && !isQuestion && text.length > 1) return { ok: true, raw: "Other", display: clip(capFirst(text)) };
      return { ok: false };
    }
    if (step.type === "multi") {
      let picked = chip && chip.multi ? chip.multi : step.options.filter((o) => optMatches(o, text));
      if (!(chip && chip.multi) && S.hints[step.key]) {
        step.options.forEach((o) => { if (S.hints[step.key].has(optValue(o)) && !picked.includes(o)) picked.push(o); });
      }
      if (picked.some((o) => !o.none)) picked = picked.filter((o) => !o.none);
      if (picked.length) return { ok: true, raw: picked.map(optValue), display: picked.map(optDisplay).join(", ") };
      if (step.freeform && !guarded && !isQuestion && text.length > 1) return { ok: true, raw: ["Other"], display: clip(capFirst(text)) };
      return { ok: false };
    }
    if (step.type === "phone") {
      const words = { zero: 0, oh: 0, o: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9 };
      let d = text.toLowerCase().replace(/\b(zero|oh|o|one|two|three|four|five|six|seven|eight|nine)\b/g, (w) => words[w]).replace(/\D/g, "");
      if (d.length === 11 && d[0] === "1") d = d.slice(1);
      if (d.length !== 10) return { ok: false };
      const f = `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
      return { ok: true, raw: f, display: f };
    }
    // text
    if (step.optional && ((chip && chip.skip) || (step.skip && step.skip.test(text)))) {
      return { ok: true, raw: step.skipValue || "None", display: step.skipValue || "None" };
    }
    if (guarded || isQuestion) return { ok: false };
    let v = text.replace(step.clean || /^$/, "").replace(/[.!]+$/, "").trim();
    if (v.length < 2) return { ok: false };
    if (step.key === "name" && v === v.toLowerCase()) v = v.replace(/\b\w/g, (c) => c.toUpperCase());
    v = capFirst(v);
    v = v.replace(/(?:\+?1[\s.-]?)?\(?(\d{3})\)?[\s.-]?(\d{3})[\s.-]?(\d{4})\b/g, "($1) $2-$3");
    if (v.length > 300) v = v.slice(0, 300) + "…";
    return { ok: true, raw: v, display: v };
  }

  /* ---------- urgency ---------- */
  function computeUrgent() {
    const fromRules = CONFIG.urgent.rules.filter((r) => {
      const v = S.raw[r.key];
      if (v == null) return false;
      if (r.includes) return Array.isArray(v) ? v.includes(r.includes) : v === r.includes;
      if (r.equals) return v === r.equals;
      return false;
    }).map((r) => r.reason);
    return [...new Set([...fromRules, ...S.mentioned])];
  }
  // Scan free text for urgent situations the caller mentions before being asked.
  function detectFromSpeech(text) {
    const answered = [];
    (CONFIG.urgent.detect || []).forEach((d) => {
      if (!d.match.test(text) || (d.unless && d.unless.test(text))) return;
      if (d.answers) {
        const step = STEPS.find((s) => s.key === d.answers.key);
        const opt = step && (step.options || []).find((o) => optValue(o) === d.answers.value);
        if (step && S.raw[step.key] == null) {
          S.raw[step.key] = d.answers.value;
          S.answers[step.key] = opt ? optDisplay(opt) : d.answers.value;
          answered.push(step.key);
        } else if (!step && !S.mentioned.includes(d.reason)) S.mentioned.push(d.reason);
      } else if (!S.mentioned.includes(d.reason)) S.mentioned.push(d.reason);
      if (d.preselect) (S.hints[d.preselect.key] = S.hints[d.preselect.key] || new Set()).add(d.preselect.value);
    });
    // Soft hints: tick options the caller already mentioned (chips only; never auto-added to typed answers).
    STEPS.filter((s) => s.type === "multi" && s.preselectFromSpeech && S.raw[s.key] == null).forEach((s) => {
      s.options.filter((o) => !o.none && optMatches(o, text)).forEach((o) => {
        (S.soft[s.key] = S.soft[s.key] || new Set()).add(optValue(o));
      });
    });
    return answered;
  }
  async function announceUrgentIfNew() {
    if (refreshUrgent()) await say(fill(CONFIG.urgent.callerMessage), { html: true, cls: "alert" });
  }
  function nextUnanswered(i) {
    while (i < STEPS.length && S.raw[STEPS[i].key] != null) i++;
    return i;
  }
  function refreshUrgent() {
    S.urgentReasons = computeUrgent();
    els.urgentPill.hidden = S.urgentReasons.length === 0;
    const newly = S.urgentReasons.length > 0 && !S.urgentAnnounced;
    if (newly) S.urgentAnnounced = true;
    return newly;
  }

  /* ---------- summary ---------- */
  function summaryRows() {
    return FLOW.fields
      .filter((f) => f.key !== "area" || S.answers.area)
      .map((f) => ({ label: f.label, value: S.answers[f.key] || "—" }));
  }

  /* ---------- service area ---------- */
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  function checkArea(addr) {
    const A = CONFIG.serviceArea; if (!A) return { status: "in", town: "" };
    const pc = addr.match(/\b([A-Z]\d[A-Z])\s?\d[A-Z]\d\b/i);
    if (pc) {
      const fsa = pc[1].toUpperCase();
      return A.postalPrefixes.some((p) => fsa.startsWith(p.toUpperCase())) ? { status: "in", town: fsa } : { status: "out", town: "postal code " + fsa };
    }
    const place = A.places.find((p) => new RegExp("\\b" + reEsc(p) + "\\b", "i").test(addr));
    if (place) return { status: "in", town: place };
    const parts = addr.split(",").map((x) => x.trim()).filter(Boolean);
    if (parts.length > 1) {
      const town = parts.slice(1).map((x) => x.replace(/\b(ON|Ont\.?|Ontario|Canada)\b\.?/gi, "").trim()).filter((x) => x && !/^\d/.test(x))[0];
      if (town) return { status: "out", town };
    }
    return { status: "unknown", town: "" };
  }

  /* ---------- flow ---------- */
  async function askStep(step, override) {
    S.phase = "step";
    await say(fill(override || step.prompt));
    renderStepChips(step);
    setComposer(true, step.placeholder);
  }

  async function accept(step, r) {
    S.raw[step.key] = r.raw;
    S.answers[step.key] = r.display;
    let areaOutside = false;
    if (step.areaCheck && CONFIG.serviceArea) {
      const a = checkArea(r.display);
      if (a.status === "unknown" && !r.townAsked) {
        S.phase = "areaTown"; S.pendingStep = step;
        await say(fill(CONFIG.serviceArea.askTown));
        renderChips(CONFIG.serviceArea.townChips.map((label) => ({ label })));
        setComposer(true, "Town or city…");
        return;
      }
      const t = a.town || "Unknown";
      S.answers.area = fill(a.status === "in" ? CONFIG.serviceArea.insideLabel : CONFIG.serviceArea.outsideLabel, { town: t });
      areaOutside = a.status !== "in";
    }
    const newly = refreshUrgent();
    if (areaOutside) await say(fill(CONFIG.serviceArea.outside));
    if (S.editing) {
      S.editing = null;
      if (newly) await say(fill(CONFIG.urgent.callerMessage), { html: true, cls: "alert" });
      return goConfirm();
    }
    if (step.ack) await say(fill(step.ack));
    if (newly) await say(fill(CONFIG.urgent.callerMessage), { html: true, cls: "alert" });
    S.idx = nextUnanswered(S.idx + 1);
    if (S.idx < STEPS.length) await askStep(STEPS[S.idx]);
    else await goConfirm();
  }

  async function onGreeting(text, chip, guards) {
    const di = STEPS.findIndex((s) => s.detectFromGreeting);
    const step = STEPS[di];
    const o = step ? bestOption(step.options, text) : null;
    if (o && !o.other) {
      S.raw[step.key] = optValue(o); S.answers[step.key] = optDisplay(o);
      refreshUrgent();
      await say(fill(FLOW.greetingReply.detected, { phrase: o.phrase || o.label.toLowerCase() }));
      S.idx = nextUnanswered(di + 1);
    } else {
      await say(fill(guards.length || S.urgentAnnounced ? FLOW.greetingReply.afterGuardrail : FLOW.greetingReply.default));
      S.idx = nextUnanswered(0);
    }
    await askStep(STEPS[S.idx]);
  }

  async function onStep(text, chip, guards) {
    const step = STEPS[S.idx];
    if (!chip && S.justAnswered.includes(step.key)) return accept(step, { ok: true, raw: S.raw[step.key], display: S.answers[step.key] });
    const r = parse(step, text, chip, guards.length > 0);
    if (r.followUp) {
      S.phase = "followUp"; S.pendingOption = r.followUp;
      await say(fill(r.followUp.followUp));
      clearChips(); setComposer(true, step.placeholder);
      return;
    }
    if (!r.ok) {
      // If a guardrail already answered, just re-ask the question; otherwise ask for clarification.
      await say(fill(guards.length ? step.prompt : step.retry || step.prompt));
      renderStepChips(step); setComposer(true, step.placeholder);
      return;
    }
    await accept(step, r);
  }

  async function onFollowUp(text, chip, guards) {
    const step = STEPS[S.idx];
    if (guards.length || text.length < 2) {
      await say(fill(S.pendingOption.followUp));
      setComposer(true, step.placeholder);
      return;
    }
    S.phase = "step";
    await accept(step, { ok: true, raw: "Other", display: clip(capFirst(text)) });
  }

  async function onAreaTown(text, chip, guards) {
    const step = S.pendingStep;
    if (guards.length || text.length < 2 || /\?\s*$/.test(text)) {
      await say(fill(CONFIG.serviceArea.askTown));
      renderChips(CONFIG.serviceArea.townChips.map((label) => ({ label })));
      setComposer(true, "Town or city…");
      return;
    }
    S.phase = "step";
    const town = clip(capFirst(text.replace(/^(it'?s|it is|in)\s+/i, "").replace(/[.!]+$/, "")), 60);
    const addr = S.answers[step.key] + ", " + town;
    await accept(step, { ok: true, raw: addr, display: addr, townAsked: true });
  }

  async function goConfirm() {
    S.phase = "confirm";
    await say(fill(CONFIG.confirm.intro));
    await wait(250);
    const card = document.createElement("div");
    card.className = "bubble card";
    const dl = document.createElement("dl");
    if (S.urgentReasons.length) {
      const f = document.createElement("div"); f.className = "flag";
      f.textContent = CONFIG.urgent.label + ": " + S.urgentReasons.join(", ");
      dl.appendChild(f);
    }
    summaryRows().forEach(({ label, value }) => {
      const dt = document.createElement("dt"); dt.textContent = label;
      const dd = document.createElement("dd"); dd.textContent = value;
      dl.append(dt, dd);
    });
    card.appendChild(dl);
    S.log.push({ who: "agent", text: "[Read back] " + summaryRows().map((x) => x.label + ": " + x.value).join("; ") });
    addRow("agent", card);
    speak(summaryRows().map((x) => x.label + ", " + x.value).join(". "));
    await say(fill(CONFIG.confirm.question));
    renderChips([{ label: CONFIG.confirm.yesLabel, yes: true }, { label: CONFIG.confirm.noLabel, no: true }]);
    setComposer(true, "Yes, or tell me what to fix…");
  }

  function findStepMention(text) {
    const t = text.toLowerCase();
    const syn = {
      backup: /\b(backup|back-up|someone else|other contact|emergency contact)\b/,
      name: /\bname\b/, phone: /\b(number|phone|callback|cell)\b/, address: /\b(address|street|location|town|city|area)\b/,
      incident: /\b(happened|what happened|incident|tree|limb)\b/, damage: /\b(damage|hit|house|car|power|lines?)\b/,
      injuries: /\b(hurt|injur\w*)\b/,
      bestTime: /\b(best time|time to call|mornings?|afternoons?|evenings?)\b/,
      service: /\b(service|kind of work|type of work|pruning|removal)\b/,
      details: /\b(details|description|how many)\b/,
    };
    // Most specific first, so "backup number" doesn't land on the callback number.
    const order = ["backup", "bestTime", "service", "details", "injuries", "damage", "incident", "address", "phone", "name"];
    const byLabel = STEPS.find((s) => t.includes(s.label.toLowerCase()));
    const bySyn = order.map((k) => STEPS.find((s) => s.key === k)).find((s) => s && syn[s.key] && syn[s.key].test(t));
    return bySyn || byLabel;
  }

  async function onConfirm(text, chip, guards) {
    const c = CONFIG.confirm;
    let yes = chip ? !!chip.yes : false, no = chip ? !!chip.no : false;
    if (!chip) { no = c.no.test(text); yes = !no && c.yes.test(text); }
    if (yes) return finish();
    if (no) {
      const direct = !chip && findStepMention(text);
      if (direct) return startEdit(direct);
      S.phase = "editPick";
      await say(fill(c.editAsk));
      renderChips(STEPS.map((s) => ({ label: s.label, step: s })));
      setComposer(true, "Which detail?");
      return;
    }
    await say(fill(c.question));
    renderChips([{ label: c.yesLabel, yes: true }, { label: c.noLabel, no: true }]);
    setComposer(true);
  }

  async function startEdit(step) {
    S.editing = step.key;
    S.idx = STEPS.indexOf(step);
    const override = step.type === "text" || step.type === "phone"
      ? fill(CONFIG.confirm.editPrompt, { label: step.label.toLowerCase() }) : step.prompt;
    await askStep(step, override);
  }

  async function onEditPick(text, chip, guards) {
    const step = (chip && chip.step) || findStepMention(text);
    if (step) return startEdit(step);
    await say(fill(CONFIG.confirm.editAsk));
    renderChips(STEPS.map((s) => ({ label: s.label, step: s })));
    setComposer(true, "Which detail?");
  }

  async function finish() {
    S.phase = "done";
    clearChips(); setComposer(false, "Call ended");
    await say(fill(S.urgentReasons.length ? FLOW.closing.urgent : FLOW.closing.normal));
    await untilQuiet(20000);
    stopTimer();
    sys("Call ended · " + mmss(Date.now() - S.start));
    await wait(CONFIG.timing.endDelayMs);
    showEnd();
  }

  async function handleInput(text, chip = null) {
    text = String(text || "").trim();
    if (S.busy || !text || S.phase === "done" || S.phase === "intro") return;
    const st = S;
    st.busy = true;
    hush(); stopListening();
    clearChips(); setComposer(false); els.input.value = "";
    bubble("caller", text);
    try {
      const guards = matchGuardrails(text);
      for (const g of guards) await say(fill(g.reply));
      S.justAnswered = [];
      if (S.phase === "greeting") setFlow(routeFlow(text));
      if (["greeting", "step", "followUp"].includes(S.phase) && !S.editing && !(chip && (chip.option || chip.multi))) {
        S.justAnswered = detectFromSpeech(text);
        await announceUrgentIfNew();
      }
      const handlers = { greeting: onGreeting, step: onStep, followUp: onFollowUp, areaTown: onAreaTown, confirm: onConfirm, editPick: onEditPick };
      await handlers[S.phase](text, chip, guards);
    } catch (e) {
      if (!(e instanceof Cancelled)) throw e;
    } finally {
      st.busy = false;
    }
  }

  /* ---------- screens ---------- */
  function startTimer() {
    stopTimer();
    const tick = () => { els.headSub.textContent = CONFIG.business.shortName + " · " + mmss(Date.now() - S.start); };
    tick(); timer = setInterval(tick, 1000);
  }
  function stopTimer() { if (timer) clearInterval(timer); timer = null; els.liveDot.classList.add("off"); }

  async function startCall() {
    const id = ++runId;
    hush(); stopListening();
    reset();
    setFlow(scenario.flow);
    els.intro.hidden = true; els.end.hidden = true; els.call.hidden = false;
    els.chat.innerHTML = ""; clearChips(); setComposer(false);
    els.liveDot.classList.add("off");
    els.headSub.textContent = "Calling " + CONFIG.business.phone + "…";
    sys("Calling " + CONFIG.business.shortName + "…");
    try {
      await wait(CONFIG.timing.ringMs);
      if (id !== runId) return;
      S.start = Date.now(); els.liveDot.classList.remove("off"); startTimer();
      sys("Connected");
      S.phase = "greeting";
      S.busy = true;
      await say(fill(scenario.greeting));
      S.busy = false;
      renderChips(scenario.suggestions.map((label) => ({ label })));
      setComposer(true, fill("Tell {receptionist} what's going on…"));
    } catch (e) { if (!(e instanceof Cancelled)) throw e; }
  }

  function summaryHeading() {
    return fill(FLOW.heading);
  }
  function summaryText() {
    const lines = [];
    if (S.urgentReasons.length) lines.push(CONFIG.urgent.label + ": " + S.urgentReasons.join(" · "), "");
    lines.push(summaryHeading());
    summaryRows().forEach(({ label, value }) => lines.push(label + ": " + value));
    lines.push("", fill(CONFIG.summary.footer));
    return lines.join("\n");
  }
  async function copySummary() {
    const btn = $("copyBtn"), text = summaryText();
    let ok = false;
    try {
      // Some browsers leave the clipboard promise pending (e.g. pages opened from disk); don't hang on it.
      await Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 1200))]);
      ok = true;
    } catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove();
    }
    btn.textContent = ok ? "Copied" : "Couldn't copy";
    setTimeout(() => { btn.textContent = "Copy summary"; }, 1800);
  }
  function renderTranscript() {
    const box = $("transcript"); box.innerHTML = "";
    S.log.forEach(({ who, text }) => {
      const p = document.createElement("p");
      const b = document.createElement("b");
      b.textContent = (who === "agent" ? CONFIG.receptionist.name : "Caller") + ": ";
      p.append(b, document.createTextNode(text));
      box.appendChild(p);
    });
  }

  function showEnd() {
    renderTranscript();
    els.call.hidden = true; els.end.hidden = false;
    // The scenario sets the day and time, so the storm call lands on Sunday morning.
    const clock = scenario.clock || { day: "Today", time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) };
    $("smsClock").textContent = clock.time.replace(/\s?[AP]M$/i, "");
    $("smsStamp").textContent = clock.day + " " + clock.time;
    $("smsAvatar").textContent = CONFIG.business.initials;
    $("smsTitle").textContent = fill(CONFIG.summary.title);
    $("smsSub").textContent = fill(CONFIG.summary.subtitle);
    const body = $("smsBody");
    let html = "";
    if (S.urgentReasons.length) {
      html += `<span class="urgent-tag">${escapeHtml(CONFIG.urgent.label)}</span>\n${escapeHtml(S.urgentReasons.join(" · "))}\n\n`;
    }
    html += `<b>${escapeHtml(summaryHeading())}</b>\n`;
    const keepPhone = (h) => h.replace(/\(\d{3}\) \d{3}-\d{4}/g, (m) => `<span class="nowrap">${m}</span>`);
    html += summaryRows().map(({ label, value }) => `${escapeHtml(label)}: ${keepPhone(escapeHtml(value))}`).join("\n");
    html += `\n\n${escapeHtml(fill(CONFIG.summary.footer))}`;
    body.innerHTML = html;
    els.end.scrollTop = 0;
    $("restartEnd").focus({ preventScroll: true });
  }

  function reset() {
    S = { phase: "intro", idx: 0, answers: {}, raw: {}, urgentReasons: [], urgentAnnounced: false,
          busy: false, editing: null, pendingOption: null, multiSel: new Set(), start: Date.now(),
          mentioned: [], justAnswered: [], hints: {}, soft: {}, log: [], pendingStep: null, flow: null };
    els.urgentPill.hidden = true;
  }

  /* ---------- boot ---------- */
  Object.entries(CONFIG.theme || {}).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  document.title = CONFIG.business.shortName + " · " + CONFIG.receptionist.name;
  reset();
  $("introLogo").textContent = CONFIG.business.initials;
  $("introName").textContent = CONFIG.business.name;
  $("introWhere").textContent = CONFIG.business.tagline + "\n" + CONFIG.business.address + " · Serving " + CONFIG.business.serviceArea;
  $("introScenario").textContent = fill(CONFIG.intro.pitch);
  $("pickLabel").textContent = fill(CONFIG.intro.pickLabel);
  $("picker").setAttribute("aria-label", fill(CONFIG.intro.pickLabel));
  const pickBtns = CONFIG.scenarios.map((sc) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pick"; b.setAttribute("role", "radio");
    b.innerHTML = '<span class="w"></span><span class="t"></span><span class="b"></span>';
    b.querySelector(".w").textContent = sc.when;
    b.querySelector(".t").textContent = sc.title;
    b.querySelector(".b").textContent = sc.blurb;
    b.addEventListener("click", () => chooseScenario(sc));
    $("picker").appendChild(b);
    return b;
  });
  function chooseScenario(sc) {
    scenario = sc;
    pickBtns.forEach((b, i) => b.setAttribute("aria-checked", CONFIG.scenarios[i] === sc ? "true" : "false"));
  }
  chooseScenario(scenario);
  $("callBtnLabel").textContent = fill(CONFIG.intro.callLabel);
  $("headAvatar").textContent = CONFIG.receptionist.name[0];
  $("headName").textContent = CONFIG.receptionist.name + " · " + CONFIG.receptionist.role;
  $("urgentPill").textContent = fill(CONFIG.urgent.banner || CONFIG.urgent.label);
  $("endLede").textContent = fill(CONFIG.endScreen.lede);
  $("endNote").textContent = fill(CONFIG.endScreen.note);

  if (FAST) window.__receptionist = { state: () => S, config: CONFIG, steps: () => STEPS, scenario: () => scenario.id, checkArea };

  $("callBtn").addEventListener("click", startCall);
  $("restartTop").addEventListener("click", startCall);
  $("restartEnd").addEventListener("click", startCall);
  $("copyBtn").addEventListener("click", copySummary);
  if (synth) {
    els.voiceBtn.hidden = false;
    setVoice(voiceOn);
    els.voiceBtn.addEventListener("click", () => setVoice(!voiceOn));
  }
  if (Recognition && V.listen) {
    els.mic.hidden = false;
    els.mic.addEventListener("click", () => { if (listening) { try { rec.stop(); } catch (e) {} } else startListening(); });
  }
  els.form.addEventListener("submit", (e) => { e.preventDefault(); handleInput(els.input.value); });
})();
</script>
</body>
</html>
